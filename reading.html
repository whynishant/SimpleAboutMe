<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

    <header class="site-header">

          <div class="book-info">
            <h3>Atomic Habits</h3>
            <p>James Clear</p>
          </div>

    <footer class="site-footer">
